<!doctype html>
<html lang="es" data-bs-theme="light">

<head>
    <title>Buscar personas - MyGameList</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 & Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

    <!-- CSS Centralizado del Proyecto -->
    <link rel="stylesheet" href="../assets/css/styles.css" />

    <!--JS de la autenticacion de usuario-->
    <script src="../controllers/env.js" defer></script>
    <script src="../controllers/auth_controller.js" defer></script>
    <!--JS de amigos y busqueda de usuarios-->
    <script src="../controllers/friends_controller.js" defer></script>
    <!--JS de la barra de navegacion-->
    <script src="../assets/js/navbar.js" defer></script>
    <!--Lottie-->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>

<body class="bg-light">
    <!-- Navbar -->
    <header>
        <div id="navbar"></div>
    </header>

    <!-- Resultados de la busqueda de personas -->
    <main class="container my-4 my-md-5">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <div class="mb-4">
                <h1 id="users_title" class="fw-bold fs-3 m-0">Buscar personas</h1>
                <p class="text-secondary small mb-0">Encuentra jugadores y agrégalos a tus amigos</p>
            </div>

            <!-- Se llena desde friends_controller.js -->
            <div id="users_results" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3"></div>
        </div>
    </main>

    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Loading -->
    <div id="loading_overlay">
        <lottie-player src="../assets/lottie/loading.json" background="transparent" speed="1"
            style="width: 200px; height: 200px;" loop autoplay id="load_gif"></lottie-player>
    </div>
</body>

</html>
