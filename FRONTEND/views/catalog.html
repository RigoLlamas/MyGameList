<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Juegos - MyGameList</title>
  <!-- CSS Bootstrap & Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- CSS Centralizado del Proyecto -->
  <link rel="stylesheet" href="../assets/css/styles.css">
  <!--JS de authenticacion de usuarios-->
  <script src="../controllers/env.js" defer></script>
  <script src="../controllers/catalog_controller.js" defer></script>
  <script src="../controllers/auth_controller.js" defer></script>
  <!--JS de la barra de navegacion-->
  <script src="../assets/js/navbar.js" defer></script>
  <!--Lottie-->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

</head>
<body class="bg-light">

  <!-- Navbar -->
  <header>
    <div id="navbar"></div>
  </header>

  <!-- Seccion Principal del Catálogo -->
  <main class="container py-5">
    
    <!-- Encabezado y Acciones de Administración -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
      <div>
        <h1 class="fw-bold m-0">Catálogo de Videojuegos</h1>
        <p class="text-secondary m-0">Explora y filtra la lista global de videojuegos</p>
      </div>
    </div>

    <!-- Barra de Búsqueda, Filtros y Ordenamiento -->
    <div class="card border-0 shadow-sm p-3 mb-4 rounded-4">
      <div class="row g-3">
        <!-- Input de Búsqueda por Nombre -->
        <div class="col-md-4">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-secondary"><i class="bi bi-search"></i></span>
            <input id="catalog_search" type="text" class="form-control border-start-0" placeholder="Buscar por título...">
          </div>
        </div>
        <!-- Filtro por Género -->
        <div class="col-6 col-md-3">
          <select id="catalog_genre" class="form-select">
            <option value="" selected>Todos los géneros</option>
            <option value="aventura">Aventura</option>
            <option value="Acción">Acción</option>
            <option value="Rol">Rol</option>
            <option value="Indie">Indie</option>
            <option value="Estrategia">Estrategia</option>
            <option value="Deportes">Deportes</option>
            <option value="Free to Play">Free to Play</option>
          </select>
        </div>
        <!-- Filtro por Plataforma -->
        <div class="col-6 col-md-3">
          <select id="catalog_platform" class="form-select">
            <option value="" selected>Todas las plataformas</option>
            <option value="PC">PC</option>
            <option value="Linux">Linux</option>
            <option value="Mac">Mac</option>
          </select>
        </div>
        <!-- Ordenamiento -->
        <div class="col-12 col-md-2">
          <select id="catalog_sort" class="form-select">
            <option value="popularidad" selected>Más populares</option>
            <option value="nombre">Nombre (A-Z)</option>
            <option value="anio">Año de salida</option>
            <option value="horas">Promedio de horas</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Componente de Paginación -->
    <nav aria-label="Navegación del catálogo">
      <ul id="catalog_pagination" class="pagination justify-content-center">
      </ul>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Loading -->
  <div id="loading_overlay">
      <lottie-player src="../assets/lottie/loading.json" background="transparent" speed="1"
          style="width: 200px; height: 200px;" loop autoplay id="load_gif"></lottie-player>
  </div>
</body>
</html>
