<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalles del Juego</title>
  <!-- CSS Bootstrap & Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- CSS Centralizado del Proyecto -->
  <link rel="stylesheet" href="../assets/css/styles.css">
  <!--JS de autenticacion de usuarios-->
  <script src="../controllers/env.js" defer></script>
  <script src="../controllers/game_detail_controller.js" defer></script>
  <script src="../controllers/auth_controller.js" defer></script>
  <!--JS de la barra de navegacion-->
  <script src="../assets/js/navbar.js" defer></script>
  <!--Lottie-->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

</head>

<body class="bg-light">
  <header>
  <!-- Navbar autenticado -->
    <div id="navbar"></div>
  </header>

  <!-- Contenedor Principal del Juego -->
  <main class="container py-5">
    <div class="bg-white p-4 rounded-4 shadow-sm mb-4">

      <!-- Encabezado del Juego -->
      <div class="row align-items-start mb-4">
        <div class="col-auto">
          <div id="detail_cover" class="cover-placeholder text-secondary">
            <i class="bi bi-image fs-1 opacity-50"></i>
          </div>
        </div>
        <div class="col">
          <h1 id="detail_title" class="fw-bold mb-2">Cargando...</h1>
          <p id="detail_subtitle" class="text-secondary fs-5 mb-3"></p>
          <div id="detail_badges" class="d-flex flex-wrap gap-2 mb-3">
            
          </div>
        </div>
        <div class="col-auto">
          <div class="btn-group">
            <button type="button" class="btn btn-primary px-4 py-2">Agregar a mi lista</button>
            <button type="button" class="btn btn-primary dropdown-toggle dropdown-toggle-split px-3"
              data-bs-toggle="dropdown"></button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#">Jugando</a></li>
              <li><a class="dropdown-item" href="#">Completado</a></li>
              <li><a class="dropdown-item" href="#">Planeado</a></li>
              <li><a class="dropdown-item" href="#">Abandonado</a></li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Pestañas de Navegación -->
      <ul class="nav nav-tabs mb-4 border-bottom">
        <li class="nav-item">
          <a id="tab-info" class="nav-link active fw-semibold" href="javascript:void(0)" onclick="toggleTab('info')">Información</a>
        </li>
        <li class="nav-item">
          <a id="tab-stats" class="nav-link text-secondary" href="javascript:void(0)" onclick="toggleTab('stats')">Estadísticas</a>
        </li>
      </ul>

      <!-- Contenedor Dinámico de Pestañas -->
      <div class="col-lg-10">
        
        <!-- Detalle de Información -->
        <div id="content-info">
          <h5 class="fw-bold mb-3">Sinopsis</h5>
          <p id="detail_synopsis" class="text-secondary mb-4"> </p>

          <div class="row g-3">
            <div class="col-sm-4 fw-bold">Plataformas:</div>
            <div id="detail_platforms" class="col-sm-8 text-secondary"></div>

            <div class="col-sm-4 fw-bold">Año de salida:</div>
            <div id="detail_year" class="col-sm-8 text-secondary"></div>

            <div class="col-sm-4 fw-bold">Promedio de horas:</div>
            <div id="detail_hours" class="col-sm-8 text-secondary"></div>

            <div class="col-sm-4 fw-bold">Número de favoritos:</div>
            <div id="detail_favorites" class="col-sm-8 text-secondary"></div>
          </div>
        </div>

        <!-- Detalle de Estadísticas -->
        <div id="content-stats" class="d-none">
          <h5 class="fw-bold mb-3">Estadísticas de la Comunidad</h5>
          
          <div class="row g-3">
            <div class="col-sm-4 fw-bold">Jugadores Activos:</div>
            <div id="stats_playing" class="col-sm-8 text-secondary"></div>

            <div class="col-sm-4 fw-bold">Juegos Completados:</div>
            <div id="stats_completed" class="col-sm-8 text-secondary"></div>

            <div class="col-sm-4 fw-bold">En Plan de Jugar:</div>
            <div id="stats_planned" class="col-sm-8 text-secondary"></div>

            <div class="col-sm-4 fw-bold">Abandonados:</div>
            <div id="stats_dropped" class="col-sm-8 text-secondary"></div>

            <div class="col-sm-4 fw-bold">Calificación Media:</div>
            <div id="stats_rating" class="col-sm-8 text-secondary"></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Referencia al archivo JS externo -->
  <script src="../assets/js/game-details.js"></script>

  <!-- Loading -->
  <div id="loading_overlay">
      <lottie-player src="../assets/lottie/loading.json" background="transparent" speed="1"
          style="width: 200px; height: 200px;" loop autoplay id="load_gif"></lottie-player>
  </div>
</body>

</html>
