<!DOCTYPE html>

  <!-- CSS Centralizado del Proyecto -->
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-navy py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4" href="index.html">
        <i class="bi bi-controller fs-3"></i> MyGameList

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active border-bottom border-primary border-2" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="my-list.html">Mi Lista</a></li>
        </ul>
        <div>
          <a href="login.html" class="btn btn-outline-light rounded-pill px-4">Iniciar Sesión</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero-section text-white py-5">
    <div class="container py-4">
      <div class="row align-items-center">
        <div class="col-lg-7">
          <h1 class="display-3 fw-bold mb-3">MyGameList</h1>
          <p class="fs-4 text-light opacity-75 mb-4">Gestiona y haz seguimiento de tu biblioteca de videojuegos</p>
          <div class="d-flex gap-3">
            <a href="signup.html" class="btn btn-primary btn-lg rounded-3 px-4">Crear Cuenta</a>
            <a href="login.html" class="btn btn-outline-light btn-lg rounded-3 px-4">Iniciar Sesión</a>
          </div>
        </div>
        <div class="col-lg-5 text-center d-none d-lg-block">
          <i class="bi bi-controller opacity-25" style="font-size: 14rem;"></i>
        </div>
      </div>
    </div>
  </header>

  <!-- Section: Juegos Populares -->
  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold m-0">Juegos Populares</h2>
      <a href="catalog.html" class="text-decoration-none fw-semibold text-primary">Ver más &gt;</a>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
      <!-- Card 1 -->
      <div class="col">
        <div class="card h-100 border-0 bg-transparent">
          <div class="img-placeholder text-secondary">
            <i class="bi bi-image fs-1 opacity-50"></i>
          </div>
          <div class="card-body px-0 pt-3">
            <h6 class="card-title fw-bold text-dark mb-0">The Legend of Zelda: Breath of the Wild</h6>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col">
        <div class="card h-100 border-0 bg-transparent">
          <div class="img-placeholder text-secondary">
            <i class="bi bi-image fs-1 opacity-50"></i>
          </div>
          <div class="card-body px-0 pt-3">
            <h6 class="card-title fw-bold text-dark mb-0">Elden Ring</h6>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col">
        <div class="card h-100 border-0 bg-transparent">

        </div>
      </div>

      <!-- Card 4 -->
      <div class="col">
        <div class="card h-100 border-0 bg-transparent">
          <div class="img-placeholder text-secondary">
            <i class="bi bi-image fs-1 opacity-50"></i>
          </div>
          <div class="card-body px-0 pt-3">
            <h6 class="card-title fw-bold text-dark mb-0">Persona 5 Royal</h6>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
