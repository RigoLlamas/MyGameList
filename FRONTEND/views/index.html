<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyGameList - Inicio</title>
  <!-- CSS Bootstrap & Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- CSS Centralizado del Proyecto -->
  <link rel="stylesheet" href="../assets/css/styles.css">
  <!--JS de la autenticacion de usuario-->
  <script src="../controllers/env.js" defer></script>
  <script src="../controllers/auth_controller.js" defer></script>
  <!--JS de la barra de navegacion-->
  <script src="../assets/js/navbar.js" defer></script>
  <!--Lottie-->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

</head>
<body class="bg-light">

  <!-- Navbar -->
  <header>
    <div id="navbar"></div>
  </header>

  <!-- Hero Section -->
  <header class="hero-section text-white py-5">
    <div class="container py-4">
      <div class="row align-items-center">
        <div class="col-lg-7">
          <h1 class="display-3 fw-bold mb-3">MyGameList</h1>
          <p class="fs-4 text-light opacity-75 mb-4">Gestiona y haz seguimiento de tu biblioteca de videojuegos</p>
          <div class="d-flex gap-3">
            <h4 id="hero_welcome_message" class="d-none">Bienvenido!</h4>
            <a id="hero_register" href="login.html?modo=registro" class="btn btn-primary btn-lg rounded-3 px-4">Crear Cuenta</a>
            <a id="hero_login" href="login.html" class="btn btn-outline-light btn-lg rounded-3 px-4">Iniciar Sesión</a>
          </div>
        </div>
        <div class="col-lg-5 text-center d-none d-lg-block">
          <i class="bi bi-controller opacity-25" style="font-size: 14rem;"></i>
        </div>
      </div>
    </div>
  </header>

  <!-- Section: Juegos Populares -->
  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold m-0">Juegos Populares</h2>
      <a href="catalog.html" class="text-decoration-none fw-semibold text-primary">Ver más &gt;</a>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
      <!-- Card 1 -->
      <div class="col">
        <div class="card h-100 border-0 bg-transparent">
          <div class="img-placeholder text-secondary">
            <i class="bi bi-image fs-1 opacity-50"></i>
          </div>
          <div class="card-body px-0 pt-3">
            <h6 class="card-title fw-bold text-dark mb-0">The Legend of Zelda: Breath of the Wild</h6>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col">
        <div class="card h-100 border-0 bg-transparent">
          <div class="img-placeholder text-secondary">
            <i class="bi bi-image fs-1 opacity-50"></i>
          </div>
          <div class="card-body px-0 pt-3">
            <h6 class="card-title fw-bold text-dark mb-0">Elden Ring</h6>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col">
        <div class="card h-100 border-0 bg-transparent">
          <div class="img-placeholder text-secondary">
            <i class="bi bi-image fs-1 opacity-50"></i>
          </div>
          <div class="card-body px-0 pt-3">
            <h6 class="card-title fw-bold text-dark mb-0">Baldur's Gate 3</h6>
          </div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="col">
        <div class="card h-100 border-0 bg-transparent">
          <div class="img-placeholder text-secondary">
            <i class="bi bi-image fs-1 opacity-50"></i>
          </div>
          <div class="card-body px-0 pt-3">
            <h6 class="card-title fw-bold text-dark mb-0">Persona 5 Royal</h6>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Loading -->
  <div id="loading_overlay">
      <lottie-player src="../assets/lottie/loading.json" background="transparent" speed="1"
          style="width: 200px; height: 200px;" loop autoplay id="load_gif"></lottie-player>
  </div>
</body>
</html>
