<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyGameList - Inicio</title>
  <!-- CSS Bootstrap & Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- CSS Centralizado del Proyecto -->
  <link rel="stylesheet" href="../assets/css/styles.css">
  <!-- JS de la autenticación de usuario -->
  <script src="../controllers/env.js" defer></script>
  <script src="../controllers/auth_controller.js" defer></script>
  <!-- JS de la barra de navegación -->
  <script src="../assets/js/navbar.js" defer></script>
  <!-- JS Controlador de Inicio (Juegos Populares y Recientes) -->
  <script src="../controllers/index_controller.js" defer></script>
  <!-- Lottie -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <header>
    <div id="navbar"></div>
  </header>

  <!-- Hero Section -->
  <header class="hero-section text-white py-5">
    <div class="container py-4">
      <div class="row align-items-center">
        <div class="col-lg-7">
          <h1 class="display-3 fw-bold mb-3">MyGameList</h1>
          <p class="fs-4 text-light opacity-75 mb-4">Gestiona y haz seguimiento de tu biblioteca de videojuegos</p>
          <div class="d-flex gap-3">
            <h4 id="hero_welcome_message" class="d-none">¡Bienvenido!</h4>
            <a id="hero_register" href="login.html?modo=registro" class="btn btn-primary btn-lg rounded-3 px-4">Crear Cuenta</a>
            <a id="hero_login" href="login.html" class="btn btn-outline-light btn-lg rounded-3 px-4">Iniciar Sesión</a>
          </div>
        </div>
        <div class="col-lg-5 text-center d-none d-lg-block">
          <i class="bi bi-controller opacity-25" style="font-size: 14rem;"></i>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="container py-5">
    <!-- Section: Juegos Populares -->
    <section class="mb-5">
      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2 mb-2 fw-semibold">
            <i class="bi bi-fire me-1"></i> Tendencias en Steam
          </span>
          <h2 class="fw-bold m-0">Juegos Populares</h2>
        </div>
        <a href="catalog.html" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold">
          Ver más <i class="bi bi-arrow-right ms-1"></i>
        </a>
      </div>

      <!-- Contenedor dinámico: 1 tarjeta principal grande + 4 secundarias -->
      <div id="popularGamesGrid" class="row g-4">
        <!-- Se llena dinámicamente desde index_controller.js -->
      </div>
    </section>

    <hr class="my-5 opacity-10">

    <!-- Section: Lanzamientos Recientes -->
    <section>
      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <span class="badge bg-success-subtle text-success rounded-pill px-3 py-2 mb-2 fw-semibold">
            <i class="bi bi-stars me-1"></i> Novedades
          </span>
          <h2 class="fw-bold m-0">Lanzamientos Recientes</h2>
        </div>
        <a href="catalog.html?sort=anio" class="text-decoration-none fw-semibold text-primary">
          Explorar catálogo &gt;
        </a>
      </div>

      <!-- Contenedor dinámico para las 4 tarjetas de lanzamientos recientes -->
      <div id="recentGamesGrid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
        <!-- Se llena dinámicamente desde index_controller.js -->
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Loading -->
  <div id="loading_overlay" style="display: none;">
    <lottie-player src="../assets/lottie/loading.json" background="transparent" speed="1"
      style="width: 200px; height: 200px;" loop autoplay id="load_gif"></lottie-player>
  </div>
</body>
</html>
