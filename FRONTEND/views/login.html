<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Login</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- CSS Bootstrap & Iconos -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
         <!-- CSS Centralizado del Proyecto -->
        <link rel="stylesheet" href="../assets/css/styles.css">

        <style>
            body{
                background: linear-gradient(to bottom right, lightgray, white);
            }
            .card{
                margin:10px;
                border: 1px solid black;
                padding: 10px;
            }
            .form-title{
                font-family: Arial, Helvetica, sans-serif;
            }
            input[type="text"]{
                border-radius: 7px;
                border-color: lightgray;
                opacity: 0.5;
                margin:10px;
            }
            input[type="password"]{
                border-radius: 7px;
                border-color: lightgray;
                opacity: 0.5;
                margin:10px;
            }
            input[type="email"]{
                border-radius: 7px;
                border-color: lightgray;
                opacity: 0.5;
                margin:10px;
            }
            input[type="date"]{
                border-radius: 7px;
                border-color: lightgray;
                opacity: 0.5;
                margin:10px;
            }
            input[type="file"]{
                border-radius: 7px;
                border-color: lightgray;
                opacity: 0.5;
                margin:10px;
            }
            input[type="button"]{
                margin:10px;
                border: 1px;
                padding-left: 30px;
                padding-right: 30px;
            }
        </style>
        
        <!--Script para cambiar entre formularios-->
        <script>
            function toggleForms(){
                let form_login = document.getElementById('formLogin'),
                    form_register = document.getElementById('formRegister');

                if(form_register.style.display == 'none'){
                    form_login.style.display = 'none';
                    form_register.style.display = 'block';
                }
                else{
                    form_login.style.display = 'block';
                    form_register.style.display = 'none';
                }
            }
        </script>
        <!--Script para guardar la sesion-->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('formLogin').addEventListener('submit', (e) => {
                    e.preventDefault();
                    localStorage.setItem('usuario', e.target.email.value);
                    window.location.href = 'profile.html';
                });
            });
        </script>
        <!--Lector de modo registro-->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('modo') === 'registro') {
                    toggleForms();
                }
            });
        </script>

        <script src="../assets/js/auth.js" defer></script>
        <script src="../assets/js/navbar.js" defer></script>

    </head>

    <body class="d-flex flex-column min-vh-100">
        <header class="w-100">
            <div id="navbar"></div>
        </header>
        <main class="flex-grow-1 d-flex align-items-center justify-content-center">
            <div class="card">
                <div class="card-body">
                    <form id="formLogin" action="">
                        <h1 class="form-title">Iniciar Sesion</h1>
                        Correo:<br><input type="email" name="email" required="true" value="diego@correo.com"><br>
                        Contrasena:<br><input type="password" name="password" required="true"><br>
                        <p class="card-text text-center">
                            <input type="submit" class="btn btn-primary" value="Iniciar Sesion">
                            <br>
                            No tienes una cuenta?
                            <br>
                            <input type="button" class="btn btn-secondary" value="Crea una cuenta" onclick="toggleForms()">
                        </p>
                    </form>
                    <form id="formRegister" action="" style="display: none;">
                        <h1 class="form-title">Crear Cuenta</h1>
                        Nombre:<br><input type="text" name="name" required="true" value="Diego Alpizar"><br>
                        Correo:<br><input type="email" name="email" required="true" value="test@correo.com"><br>
                        Contrasena:<br><input type="password" name="password" required="true"><br>
                        Confirma Contrasena:<br><input type="password" name="confirm_password" required="true"><br>
                        Fecha de Nacimiento:<br><input type="date" name="birthday" required="true"><br>
                        Foto de Perfil (Opcional):<br><input type="file" name="avatar">
                        <p class="card-text text-center">
                            <input type="submit" class="btn btn-primary" value="Crear Cuenta">
                            <br>
                            Ya tienes una cuenta?
                            <br>
                            <input type="button" class="btn btn-secondary" value="Inicia Sesion" onclick="toggleForms()">
                        </p>
                    </form>
                </div>
            </div>
            
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
