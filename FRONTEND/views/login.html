<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Login</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- CSS Bootstrap & Iconos -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
         <!-- CSS Centralizado del Proyecto -->
        <link rel="stylesheet" href="../assets/css/styles.css">
        
        <!--Script para cambiar entre formularios-->
        <script>
            function toggleForms(){
                let form_login = document.getElementById('formLogin'),
                    form_register = document.getElementById('formRegister');

                if(form_register.style.display == 'none'){
                    form_login.style.display = 'none';
                    form_register.style.display = 'block';
                }
                else{
                    form_login.style.display = 'block';
                    form_register.style.display = 'none';
                }
            }
        </script>        
        <!--Lector de modo registro-->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('modo') === 'registro') {
                    toggleForms();
                }
            });
        </script>
        <!--JS de la autenticacion de usuario-->
        <script src="../controllers/env.js" defer></script>
        <script src="../controllers/auth_controller.js" defer></script>
        <!--JS de la Navbar dinamica-->
        <script src="../assets/js/navbar.js" defer></script>
        <!--Lottie-->
        <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    </head>

    <body class="d-flex flex-column min-vh-100 bg-light">
        <header class="w-100">
            <div id="navbar"></div>
        </header>
        <main class="flex-grow-1 d-flex align-items-center justify-content-center my-4 my-md-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body">
                    <!--Login-->
                    <form id="formLogin" action="">
                        <div class="text-center mb-4">
                            <i class="bi bi-controller text-primary fs-1"></i>
                            <h2 class="fw-bold mt-2 mb-1">Iniciar Sesión</h2>
                            <p class="text-secondary small mb-0">Bienvenido de vuelta a MyGameList</p>
                        </div>
                            <!--Correo-->
                            <div class="mb-3">
                                <label for="correo" class="form-label fw-semibold small">Correo:</label>
                                <div class="input-group">
                                    <input id="correo" class="form-control" type="email" name="email" required="true" value="diego@correo.com"><br>
                                </div>
                            </div>
                            <!--Contrasena-->
                            <div class="mb-3">
                                <label for="psswd" class="form-label fw-semibold small">Contrasena:</label>
                                <div class="input-group">
                                    <input id="psswd" class="form-control" type="password" name="password" required="true"><br>
                                </div>
                            </div>
                        <p class="card-text text-center">
                            <input type="submit" class="form-control btn btn-primary rounded-pill px-4" value="Iniciar Sesion">
                            <br>
                            No tienes una cuenta?
                            <br>
                            <input type="button" class="form-control btn btn-secondary rounded-pill px-4" value="Crea una cuenta" onclick="toggleForms()">
                        </p>
                    </form>
                    <!--Register-->
                    <form id="formRegister" action="" style="display: none;">
                        <div class="text-center mb-4">
                            <i class="bi bi-controller text-primary fs-1"></i>
                            <h2 class="fw-bold mt-2 mb-1">Crear Cuenta</h2>
                            <p class="text-secondary small mb-0">Bienvenido a MyGameList</p>
                        </div>
                            <!--Nombre-->
                            <div class="mb-3">
                                <label for="register_name" class="form-label fw-semibold small">Nombre:</label>
                                <div class="input-group">
                                    <input id="register_name" class="form-control" type="text" name="nombre" required="true" value="Diego Alpizar"><br>
                                </div>
                            </div>
                            <!--Correo-->
                            <div class="mb-3">
                                <label for="register_email" class="form-label fw-semibold small">Correo:</label>
                                <div class="input-group">
                                    <input id="register_email" class="form-control" type="email" name="email" required="true" value="test@correo.com"><br>
                                </div>
                            </div>
                            <!--Contrasena-->
                            <div class="mb-3">
                                <label for="register_password" class="form-label fw-semibold small">Contrasena:</label>
                                <div class="input-group">
                                    <input id="register_password" class="form-control" type="password" name="password" required="true"><br>
                                </div>
                            </div>
                            <!--Confirma contrasena-->
                            <div class="mb-3">
                                <label for="register_confirm_password" class="form-label fw-semibold small">Confirma Contrasena:</label>
                                <div class="input-group">
                                    <input id="register_confirm_password" type="password" class="form-control" name="confirm_password" required="true"><br>
                                </div>
                            </div>
                            <!--Fecha Nacimiento-->
                            <div class="mb-3">
                                <label for="register_birthday" class="form-label fw-semibold small">Fecha de Nacimiento:</label>
                                <div class="input-group">
                                    <input id="register_birthday" type="date" class="form-control" name="fechaNacimiento" required="true"><br>
                                </div>
                            </div>
                            <!--Foto de perfil-->
                            <div class="mb-3">
                                <label for="register_picture" class="form-label fw-semibold small"> Foto de Perfil (opcional)</label>
                                <div class="input-group">
                                    <input type="file" id="register_picture" class="form-control" name="fotoPerfil">
                                </div>
                            </div>
                        <p class="card-text text-center">
                            <input type="submit" class="form-control btn btn-primary  rounded-pill px-4" value="Crear Cuenta">
                            <br>
                            Ya tienes una cuenta?
                            <br>
                            <input type="button" class="form-control btn btn-secondary  rounded-pill px-4" value="Inicia Sesion" onclick="toggleForms()">
                        </p>
                    </form>
                </div>
            </div>
            
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <!-- Loading -->
        <div id="loading_overlay">
            <lottie-player src="../assets/lottie/loading.json" background="transparent" speed="1"
                style="width: 200px; height: 200px;" loop autoplay id="load_gif"></lottie-player>
        </div>
    </body>
</html>
